<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <h1>📅 Schedule Planner</h1>
  <div class="bar">
    <button id="vw" class="on">Week</button><button id="vm">Month</button>
    <select id="accent"><option value="ocean">🌊 Ocean</option><option value="sunset">🌅 Sunset</option><option value="forest">🌲 Forest</option><option value="violet">🔮 Violet</option></select>
    <button id="mode" title="Light / dark">🌓</button>
  </div>
</header>
<div class="bar toolbar" style="justify-content:space-between;margin-bottom:12px">
  <div class="bar"><button id="prev">‹</button><span class="title" id="ttl"></span><button id="next">›</button><button id="tod">Today</button></div>
  <button class="primary" id="add">+ Add class / event</button>
</div>
<div class="card scroll" id="view"></div>
</div>

<dialog id="dlg">
  <h3 id="dt" style="margin:0 0 4px">Add event</h3>
  <label>Title</label><input type="text" id="f-title" placeholder="e.g. Math class">
  <label>Date</label><input type="date" id="f-date">
  <div class="row"><div><label>Start</label><input type="time" id="f-start"></div><div><label>End</label><input type="time" id="f-end"></div></div>
  <label><input type="checkbox" id="f-rep"> Repeat every week</label>
  <label>Notes</label><textarea id="f-note" rows="2" placeholder="Room, teacher, etc."></textarea>
  <label>Color</label><div class="sw" id="sw"></div>
  <div class="act"><button class="danger" id="del">Delete</button><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
</dialog>

<script src="script.js"></script>
</body>
</html>
